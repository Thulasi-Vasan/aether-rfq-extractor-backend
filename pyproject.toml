[project]
name = "aether-rfq-extractor-backend"
version = "0.1.0"
description = "FastAPI backend for extracting frontend-renderable tables from RFQ PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.5",
    "boto3>=1.34.0",
    "pillow>=12.2.0",
    "cadquery>=2.7.0",
    "jinja2>=3.1.0",
    "sqlalchemy>=2.0.51",
    "passlib>=1.7.4",
    "bcrypt==3.2.2",
    "pyjwt>=2.13.0",
    "weasyprint>=69.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
